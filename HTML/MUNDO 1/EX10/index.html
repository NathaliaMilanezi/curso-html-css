<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midías HTML</title>
</head>
<body>
    
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse arquivo em vários dispositovos diferentes.</p>

    <picture>
        <source media="(max-width:750px )" srcset="Imagens/imagemP.png" type="image/png">
        <source media="(max-width:1050px)" srcset="Imagens/imagemM.png" type="image/png">
        <img src="Imagens/imagemG.png" alt="Imagem flexível">
    </picture>

</body>
</html>
